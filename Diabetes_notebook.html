<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Ai NoteX Pro V2 | 당뇨 수첩 엔진</title>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; padding: 20px; text-align: center; }
        .card { background: white; max-width: 500px; margin: auto; padding: 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        
        /* 📊 실시간 막대 그래프 */
        .chart { display: flex; justify-content: space-around; align-items: flex-end; height: 180px; border-bottom: 2px solid #ddd; padding-bottom: 30px; margin-bottom: 30px; }
        .bar { width: 30px; height: 10px; border-radius: 5px 5px 0 0; position: relative; transition: all 0.3s; background: #bdc3c7; }
        .bar span { position: absolute; bottom: -25px; left: 50%; transform: translateX(-50%); font-size: 11px; white-space: nowrap; }
        
        /* 🚦 신호등 로직 색상 */
        .safe { background: #2ecc71 !important; }    /* 120 이하 연두 */
        .warn { background: #f1c40f !important; }    /* 180 이하 노랑 */
        .danger { background: #e74c3c !important; }  /* 181 이상 빨강 */

        .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .input-box { background: #f9f9f9; padding: 10px; border-radius: 10px; }
        input { width: 80%; border: 1px solid #ccc; text-align: center; font-size: 16px; padding: 5px; border-radius: 5px; }
        label { display: block; font-size: 11px; color: #666; margin-bottom: 5px; }
    /* PC 반응형 2열 */
    @media(min-width:768px){
      .action-row { flex-direction:row; flex-wrap:wrap; justify-content:center; }
      .action-btn { width:45%; margin:5px; }
    }
  
    </style>
</head>
<body>

<div class="card">
    <h2 style="color:#2c3e50;">Diabetes_notebook | 당뇨 노트</h2>
<h4 style="color:#2c3e50;">AI NOTEX PRO PLATFORM</h4>
<h6 style="color:#2c3e50;">"Google Gemini AI 기술을 결합하여, 더 정교한 '실시간 당뇨 분석 엔진'으로 업데이트 중입니다."</h6>

    
    <div class="chart">
        <div id="b1" class="bar"><span>공복</span></div>
        <div id="b2" class="bar"><span>아침후</span></div>
        <div id="b3" class="bar"><span>점심전</span></div>
        <div id="b4" class="bar"><span>점심후</span></div>
        <div id="b5" class="bar"><span>저녁전</span></div>
        <div id="b6" class="bar"><span>저녁후</span></div>
        <div id="b7" class="bar"><span>취침전</span></div>
        <div id="b8" class="bar"><span>기타</span></div>
    </div>

    <div class="input-grid">
        <div class="input-box"><label>1. 공복</label><input type="number" oninput="updateBar(1, this.value)"></div>
        <div class="input-box"><label>2. 아침후</label><input type="number" oninput="updateBar(2, this.value)"></div>
        <div class="input-box"><label>3. 점심전</label><input type="number" oninput="updateBar(3, this.value)"></div>
        <div class="input-box"><label>4. 점심후</label><input type="number" oninput="updateBar(4, this.value)"></div>
        <div class="input-box"><label>5. 저녁전</label><input type="number" oninput="updateBar(5, this.value)"></div>
        <div class="input-box"><label>6. 저녁후</label><input type="number" oninput="updateBar(6, this.value)"></div>
        <div class="input-box"><label>7. 취침전</label><input type="number" oninput="updateBar(7, this.value)"></div>
        <div class="input-box"><label>8. 기타</label><input type="number" oninput="updateBar(8, this.value)"></div>
    </div>

    
</div>

<script>
    function updateBar(id, val) {
        const bar = document.getElementById('b' + id);
        if(!val) { bar.style.height = '10px'; bar.className = 'bar'; return; }

        // 높이 조절 (최대 250 기준 비례 계산)
        let height = (val / 250) * 100;
        if(height > 100) height = 100;
        bar.style.height = height + '%';

        // 신호등 색상 판별
        bar.className = 'bar'; // 초기화
        if(val <= 120) bar.classList.add('safe');
        else if(val <= 180) bar.classList.add('warn');
        else bar.classList.add('danger');
    }
</script>

<script>
    // 1. 저장 기능: 8개의 입력값을 하나의 묶음으로 저장합니다.
    function saveDailyData() {
        const date = new Date().toLocaleDateString(); // 오늘 날짜
        const readings = [];
        
        for(let i=1; i<=8; i++) {
            const val = document.querySelector(`.input-box:nth-child(${i}) input`).value;
            readings.push(val || 0); // 입력 안했으면 0으로 처리
        }

        // 데이터 저장소(LocalStorage)에 넣기
        const history = JSON.parse(localStorage.getItem('diabetes_v2_logs')) || {};
        history[date] = readings;
        localStorage.setItem('diabetes_v2_logs', JSON.stringify(history));

        alert(date + " 데이터가 V2 장부에 기록되었습니다!");
    }

    // 2. 불러오기 기능: 페이지를 열면 저장된 오늘 데이터를 화면에 뿌려줍니다.
    window.onload = function() {
        const date = new Date().toLocaleDateString();
        const history = JSON.parse(localStorage.getItem('diabetes_v2_logs')) || {};
        
        if(history[date]) {
            const data = history[date];
            data.forEach((val, index) => {
                if(val > 0) {
                    const input = document.querySelector(`.input-box:nth-child(${index+1}) input`);
                    input.value = val;
                    updateBar(index+1, val); // 그래프 업데이트
                }
            });
        }
    }
</script>

<button onclick="saveDailyData()" style="
    grid-column: span 2; 
    background: #2c3e50; 
    color: white; 
    padding: 15px; 
    border-radius: 10px; 
    border: none; 
    font-weight: bold; 
    margin-top: 15px; 
    cursor: pointer;
    width: 100%;">
    💾 오늘의 혈당 수치 저장
</button>

<div style="margin-bottom: 20px;">
    <label style="font-size: 14px; font-weight: bold;">📅 기록 날짜 선택: </label>
    <input type="date" id="targetDate" onchange="loadDailyData()" style="padding: 5px; border-radius: 5px; border: 1px solid #2c3e50;">
</div>

<script>
    // 페이지 열릴 때 오늘 날짜로 자동 설정
    window.onload = function() {
        document.getElementById('targetDate').value = new Date().toISOString().substring(0, 10);
        loadDailyData();
    };

    // 💾 [저장] 선택된 날짜에 8개 데이터를 저장합니다.
    function saveDailyData() {
        const date = document.getElementById('targetDate').value;
        const readings = [];
        
        for(let i=1; i<=8; i++) {
            // 입력값 가져오기 (updateBar에서 사용한 ID 체계와 맞춤)
            const val = document.querySelector(`.input-box:nth-child(${i}) input`).value;
            readings.push(val || ""); 
        }

        let history = JSON.parse(localStorage.getItem('diabetes_v2_logs')) || {};
        history[date] = readings; // 해당 날짜 칸에 데이터 쏙!
        localStorage.setItem('diabetes_v2_logs', JSON.stringify(history));

        alert(date + " 장부에 안전하게 기록되었습니다!");
    }

    // 📂 [불러오기] 날짜를 바꿀 때마다 해당 날짜 데이터를 가져와 그래프를 그립니다.
    function loadDailyData() {
        const date = document.getElementById('targetDate').value;
        const history = JSON.parse(localStorage.getItem('diabetes_v2_logs')) || {};
        
        // 그래프와 입력창 초기화
        for(let i=1; i<=8; i++) {
            updateBar(i, 0); 
            document.querySelector(`.input-box:nth-child(${i}) input`).value = "";
        }

        // 저장된 데이터가 있으면 채워넣기
        if(history[date]) {
            const data = history[date];
            data.forEach((val, index) => {
                if(val) {
                    document.querySelector(`.input-box:nth-child(${index+1}) input`).value = val;
                    updateBar(index+1, val);
                }
            });
        }
    }
</script>

<div id="stats-panel" style="margin-top: 25px; padding: 15px; background: #fff; border-radius: 15px; box-shadow: inset 0 0 10px rgba(0,0,0,0.05); text-align: left;">
    <h3 style="font-size: 16px; color: #2c3e50; border-bottom: 2px solid #3498db; display: inline-block;">📈 핵심 통계 분석 (V2)</h3>
    <div style="display: flex; justify-content: space-around; margin-top: 15px;">
        <div style="text-align: center;">
            <div style="font-size: 11px; color: #7f8c8d;">최근 7일 평균</div>
            <div id="weekAvg" style="font-size: 20px; font-weight: bold; color: #2ecc71;">0</div>
        </div>
        <div style="text-align: center;">
            <div style="font-size: 11px; color: #7f8c8d;">최근 30일 평균</div>
            <div id="monthAvg" style="font-size: 20px; font-weight: bold; color: #3498db;">0</div>
        </div>
        <div style="text-align: center;">
            <div style="font-size: 11px; color: #7f8c8d;">위험(180↑) 횟수</div>
            <div id="dangerCount" style="font-size: 20px; font-weight: bold; color: #e74c3c;">0</div>
        </div>
    </div>
</div>

<script>
    // 2. 통계 계산 함수: 저장된 모든 날짜를 뒤져서 평균을 냅니다.
    function updateStats() {
        const history = JSON.parse(localStorage.getItem('diabetes_v2_logs')) || {};
        const dates = Object.keys(history).sort().reverse(); // 최신순 정렬
        
        let weekSum = 0, weekCount = 0;
        let monthSum = 0, monthCount = 0;
        let dangerCount = 0;

        const now = new Date();
        
        for (let dateStr in history) {
            const logDate = new Date(dateStr);
            const diffDays = Math.ceil(Math.abs(now - logDate) / (1000 * 60 * 60 * 24));
            const dayValues = history[dateStr].filter(v => v > 0).map(Number);
            
            dayValues.forEach(val => {
                // 30일 통계
                if (diffDays <= 30) {
                    monthSum += val;
                    monthCount++;
                }
                // 7일 통계
                if (diffDays <= 7) {
                    weekSum += val;
                    weekCount++;
                }
                // 위험 횟수 (180 이상)
                if (val >= 180) dangerCount++;
            });
        }

        document.getElementById('weekAvg').innerText = weekCount ? Math.round(weekSum / weekCount) : 0;
        document.getElementById('monthAvg').innerText = monthCount ? Math.round(monthSum / monthCount) : 0;
        document.getElementById('dangerCount').innerText = dangerCount;
    }

    // 저장 버튼 누를 때마다 통계도 새로고침
    const originalSave = saveDailyData;
    saveDailyData = function() {
        originalSave();
        updateStats();
    };

    // 처음 켰을 때도 통계 계산
    window.onload = function() {
        document.getElementById('targetDate').value = new Date().toISOString().substring(0, 10);
        loadDailyData();
        updateStats();
    };
</script>

</body>
</html>
