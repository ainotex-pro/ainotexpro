<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Ai NoteX Pro V2 | 당뇨 수첩 엔진</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: sans-serif; background: #f4f7f6; padding: 20px; text-align: center; }
        .card { background: white; max-width: 500px; margin: auto; padding: 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        
        /* 📊 실시간 막대 그래프 */
        .chart { display: flex; justify-content: space-around; align-items: flex-end; height: 180px; border-bottom: 2px solid #ddd; padding-bottom: 30px; margin-bottom: 30px; }
        .bar { width: 30px; height: 10px; border-radius: 5px 5px 0 0; position: relative; transition: all 0.3s; background: #bdc3c7; }
        .bar span { position: absolute; bottom: -25px; left: 50%; transform: translateX(-50%); font-size: 11px; white-space: nowrap; }
        
        /* 🚦 신호등 로직 */
        .safe { background: #2ecc71 !important; }    /* 120 이하 연두 */
        .warn { background: #f1c40f !important; }    /* 180 이하 노랑 */
        .danger { background: #e74c3c !important; }  /* 181 이상 빨강 */

        .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .input-box { background: #f9f9f9; padding: 10px; border-radius: 10px; }
        input { width: 80%; border: 1px solid #ccc; text-align: center; font-size: 16px; padding: 5px; border-radius: 5px; }
        label { display: block; font-size: 11px; color: #666; margin-bottom: 5px; }
        
        button#save-btn { background: #2c3e50; color: white; padding: 15px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }
        button#save-btn:hover { background: #34495e; }
    </style>
</head>
<body>

<div class="card">
    <h2 style="color:#2c3e50; margin-bottom:5px;">Diabetes_notebook | 당뇨 노트</h2>
    <p style="font-size:12px; color:#7f8c8d; margin-top:0;">AI NOTEX PRO PLATFORM</p>
    <p style="font-size:10px; color:#95a5a6;">"Google Gemini AI 기술 기반 실시간 분석 엔진"</p>

    <div class="chart">
        <div id="b1" class="bar"><span>공복</span></div>
        <div id="b2" class="bar"><span>아침후</span></div>
        <div id="b3" class="bar"><span>점심전</span></div>
        <div id="b4" class="bar"><span>점심후</span></div>
        <div id="b5" class="bar"><span>저녁전</span></div>
        <div id="b6" class="bar"><span>저녁후</span></div>
        <div id="b7" class="bar"><span>취침전</span></div>
        <div id="b8" class="bar"><span>기타</span></div>
    </div>

    <div style="margin-bottom: 20px; background:#ebf0f1; padding:10px; border-radius:10px;">
        <label style="font-size: 13px; font-weight: bold; display:inline;">📅 기록 날짜: </label>
        <input type="date" id="targetDate" onchange="loadDailyData()" style="width:auto; border:none; background:transparent; font-weight:bold;">
    </div>

    <div class="input-grid">
        <div class="input-box"><label>1. 공복</label><input type="number" oninput="updateBar(1, this.value)"></div>
        <div class="input-box"><label>2. 아침후</label><input type="number" oninput="updateBar(2, this.value)"></div>
        <div class="input-box"><label>3. 점심전</label><input type="number" oninput="updateBar(3, this.value)"></div>
        <div class="input-box"><label>4. 점심후</label><input type="number" oninput="updateBar(4, this.value)"></div>
        <div class="input-box"><label>5. 저녁전</label><input type="number" oninput="updateBar(5, this.value)"></div>
        <div class="input-box"><label>6. 저녁후</label><input type="number" oninput="updateBar(6, this.value)"></div>
        <div class="input-box"><label>7. 취침전</label><input type="number" oninput="updateBar(7, this.value)"></div>
        <div class="input-box"><label>8. 기타</label><input type="number" oninput="updateBar(8, this.value)"></div>
    </div>

    <button id="save-btn" onclick="saveDailyData()">💾 오늘의 혈당 수치 저장</button>

    <div id="stats-panel" style="margin-top: 25px; padding: 15px; background: #fff; border-radius: 15px; border:1px solid #eee; text-align: left;">
        <h3 style="font-size: 15px; color: #2c3e50; border-bottom: 2px solid #3498db; display: inline-block; margin-top:0;">📈 핵심 통계 분석 (V2)</h3>
        <div style="display: flex; justify-content: space-around; margin-top: 10px;">
            <div style="text-align: center;">
                <div style="font-size: 10px; color: #7f8c8d;">7일 평균</div>
                <div id="weekAvg" style="font-size: 18px; font-weight: bold; color: #2ecc71;">0</div>
            </div>
            <div style="text-align: center;">
                <div style="font-size: 10px; color: #7f8c8d;">30일 평균</div>
                <div id="monthAvg" style="font-size: 18px; font-weight: bold; color: #3498db;">0</div>
            </div>
            <div style="text-align: center;">
                <div style="font-size: 10px; color: #7f8c8d;">위험 횟수</div>
                <div id="dangerCount" style="font-size: 18px; font-weight: bold; color: #e74c3c;">0</div>
            </div>
        </div>
    </div>
</div>

<script>
    // 1. 공통 데이터 획득 함수 (코드의 단일화)
    function getHistory() {
        return JSON.parse(localStorage.getItem('diabetes_v2_logs')) || {};
    }

    // 2. 그래프 업데이트 함수
    function updateBar(id, val) {
        const bar = document.getElementById('b' + id);
        if(!val || val <= 0) { bar.style.height = '10px'; bar.className = 'bar'; return; }

        let height = (val / 250) * 100;
        if(height > 100) height = 100;
        bar.style.height = height + '%';

        bar.className = 'bar';
        if(val <= 120) bar.classList.add('safe');
        else if(val <= 180) bar.classList.add('warn');
        else bar.classList.add('danger');
    }

    // 3. 데이터 저장 기능
    function saveDailyData() {
        const date = document.getElementById('targetDate').value;
        if(!date) return alert("날짜를 선택해주세요.");

        const readings = [];
        for(let i=1; i<=8; i++) {
            const val = document.querySelector(`.input-box:nth-child(${i}) input`).value;
            readings.push(val || ""); 
        }

        const history = getHistory();
        history[date] = readings;
        localStorage.setItem('diabetes_v2_logs', JSON.stringify(history));

        alert(date + " 기록이 저장되었습니다.");
        updateStats();
    }

    // 4. 데이터 불러오기 기능
    function loadDailyData() {
        const date = document.getElementById('targetDate').value;
        const history = getHistory();
        
        // 초기화
        for(let i=1; i<=8; i++) {
            document.querySelector(`.input-box:nth-child(${i}) input`).value = "";
            updateBar(i, 0);
        }

        // 값 채우기
        if(history[date]) {
            history[date].forEach((val, index) => {
                if(val) {
                    document.querySelector(`.input-box:nth-child(${index+1}) input`).value = val;
                    updateBar(index+1, val);
                }
            });
        }
    }

    // 5. 통계 분석 엔진
    function updateStats() {
        const history = getHistory();
        const now = new Date();
        let weekSum = 0, weekCount = 0, monthSum = 0, monthCount = 0, dangerCount = 0;

        for (let dateStr in history) {
            const logDate = new Date(dateStr);
            const diffDays = Math.ceil(Math.abs(now - logDate) / (1000 * 60 * 60 * 24));
            const dayValues = history[dateStr].filter(v => v !== "").map(Number);
            
            dayValues.forEach(val => {
                if (diffDays <= 30) { monthSum += val; monthCount++; }
                if (diffDays <= 7) { weekSum += val; weekCount++; }
                if (val >= 180) dangerCount++;
            });
        }

        document.getElementById('weekAvg').innerText = weekCount ? Math.round(weekSum / weekCount) : 0;
        document.getElementById('monthAvg').innerText = monthCount ? Math.round(monthSum / monthCount) : 0;
        document.getElementById('dangerCount').innerText = dangerCount;
    }

    // [초기 구동] 페이지가 로드될 때 단 한 번만 실행
    window.onload = function() {
        const today = new Date().toISOString().substring(0, 10);
        document.getElementById('targetDate').value = today;
        loadDailyData();
        updateStats();
    };


</script>

</body>
</html>
