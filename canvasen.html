<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AiNoteX Pro - Global Master (EN)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body { margin: 0; padding: 15px; background: linear-gradient(180deg, #fefb94 0%, #a1ffce 100%); font-family: 'Noto Sans KR', sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .header-bar { background: white; border: 3px solid #4285F4; padding: 10px 40px; border-radius: 50px; margin-bottom: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); font-size: 20px; font-weight: bold; color: #4285F4; }
        
        .lang-control { margin-bottom: 15px; background: rgba(255, 255, 255, 0.5); padding: 5px 20px; border-radius: 30px; display: flex; align-items: center; gap: 10px; border: 1px solid #1a3a5f; }
        .lang-btn { background: none !important; border: none !important; box-shadow: none !important; font-weight: bold; cursor: pointer; color: #1a3a5f; font-size: 14px; padding: 5px !important; min-width: auto !important; }
        .lang-btn.active { color: #4285f4; text-decoration: underline; font-size: 16px; }
        .lang-divider { color: #ccc; }

        .control-panel { background: #8cabd1; padding: 15px; border-radius: 15px; width: 100%; max-width: 450px; border: 3px solid #1a3a5f; margin-bottom: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); display: flex; flex-direction: column; gap: 8px; box-sizing: border-box; }
        .row { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; align-items: center; width: 100%; }
        button { flex: 1; min-width: 80px; padding: 12px 5px; border: none; border-radius: 8px; background: white; font-weight: bold; cursor: pointer; box-shadow: 0 4px 0 #bdc3c7; font-size: 13px; transition: 0.1s; }
        button:active { transform: translateY(2px); box-shadow: none; }
        .btn-select { background: #ffeb3b !important; }
        .btn-draw { background: #4285f4 !important; color: white !important; }
        .btn-text { background: #fffacd !important; }
        .btn-delete { background: #ea4335 !important; color: white !important; }
        .btn-save { background: #34a853 !important; color: white !important; }
        select { flex: 2; padding: 10px; border-radius: 8px; border: 2px solid #1a3a5f; font-weight: bold; }
        .canvas-container-box { border: 5px solid #4285F4; border-radius: 12px; background: white; width: 100%; max-width: 450px; overflow: hidden; }
    </style>
</head>
<head>
    <meta name="google" content="notranslate">
    
</head>
<body>

<div class="header-bar">💎 CANVAS STATION 💎</div>

<div class="lang-control">
    <button id="btn-kr" class="lang-btn" onclick="changeLang('KR')">KR</button>
    <span class="lang-divider">/</span>
    <button id="btn-en" class="lang-btn active" onclick="changeLang('EN')">EN</button>
</div>

<div id="sub-title" style="margin-bottom: 15px; font-size: 11px; font-weight: bold; color: #1a3a5f; letter-spacing: 1.5px; opacity: 0.8;">
     [ CANVAS STATION - AI NOTEX PRO & GOOGLE GEMINI ]
</div>

<div class="control-panel">
    <div class="row" style="background: rgba(255,255,255,0.4); padding: 8px; border-radius: 10px;">
        <select id="save-list"><option value="">📂 Saved List</option></select>
        <button id="btn-load" class="btn-draw" style="min-width: 60px;" onclick="loadFromList()">LOAD</button>
    </div>
    
    <div class="row">
        <button id="btn-select" class="btn-select" onclick="setMode('select')">🖱️ SELECT</button>
        <button id="btn-draw" class="btn-draw" onclick="setMode('draw')">✏️ DRAW</button>
        <button id="btn-addtext" class="btn-text" onclick="addObj('text')">✍️ TEXT</button>
    </div>

    <div class="row">
        <button id="btn-delobj" class="btn-delete" onclick="deleteObj()">🗑️ DELETE</button>
        <button id="btn-clear" class="btn-delete" onclick="clearAll()">🚀 CLEAR ALL</button>
        <button id="btn-save" class="btn-save" onclick="saveWithTitle()">💾 SAVE AS</button>
    </div>

    <div class="row">
        <span class="label" id="lbl-color">🎨 COLOR:</span><input type="color" id="cp" value="#1a73e8" onchange="updateBrush()">
        <span class="label" id="lbl-size">📏 SIZE:</span><input type="number" id="sp" value="80">
    </div>

    <div class="row">
        <button onclick="addObj('rect')" id="btn-rect">⬜ RECT</button>
        <button onclick="addObj('circle')" id="btn-circle">⚪ CIRCLE</button>
        <button onclick="addObj('ring')" id="btn-ring">⭕ RING</button>
    </div>
    <div class="row">
        <button onclick="addObj('star')" id="btn-star">⭐ STAR</button>
        <button onclick="addObj('heart')" id="btn-heart">❤️ HEART</button>
        <button onclick="addObj('window')" id="btn-window">🪟 WINDOW</button>
    </div>
    <div class="row">
        <button onclick="addObj('cloud')" id="btn-cloud">☁️ CLOUD</button>
        <button onclick="addObj('chat')" id="btn-chat">💬 CHAT</button>
        <button onclick="addObj('arrow')" id="btn-arrow">↗️ ARROW</button>
    </div>
    <div class="row">
        <button onclick="addObj('door')" id="btn-door">🚪 DOOR</button>
        <button id="btn-dellist" class="btn-delete" onclick="deleteFromList()" style="flex:2;">🗑️ DELETE PERMANENTLY</button>
    </div>
</div>

<div class="canvas-container-box"><canvas id="c" width="450" height="600"></canvas></div>

<div style="text-align: center; margin-top: 25px; padding: 0 10px; line-height: 1.4;">
    <hr style="border: 0; border-top: 1px solid rgba(0,0,0,0.05); margin: 8px auto; width: 90%;">
    <div style="font-size: 0.7rem; color: #999; letter-spacing: 1px;">
        [ A COLLABORATION BY Ai NoteX Pro & GOOGLE GEMINI ]
    </div>
    <hr style="border: 0; border-top: 1px solid rgba(0,0,0,0.05); margin: 8px auto; width: 90%;">
    <div style="font-size: 0.75rem; color: #777; margin: 3px 0;">
        "현재와 미래의 모든 길은 구글로 통한다" - 정승철
    </div>
    <div style="font-size: 0.65rem; color: #aaa; margin: 0;">
        "All roads, present and future, lead to Google. - Jeong Seung-cheol"
    </div>
    <hr style="border: 0; border-top: 1px solid rgba(0,0,0,0.05); margin: 8px auto; width: 90%;">
    <div style="font-size: 0.7rem; color: #bbb; margin: 3px 0;">
        [ Ai NoteX Pro Beta Test v2.0 ]
    </div>
    <div style="font-size: 0.75rem; color: #888; margin: 3px 0;">
        [ NICKNAME - TREE ] <span style="font-size: 12px; opacity: 0.6;">🌳</span>
    </div>
    <hr style="border: 0; border-top: 1px solid rgba(0,0,0,0.05); margin: 8px auto; width: 90%;">
</div>

<script>
    var canvas = new fabric.Canvas('c');
    canvas.backgroundColor = '#ffffff';
    var currentLang = 'EN';

    window.onload = function() { updateSaveList(); };

    // [핵심] 영문판에서 한글판 파일(canvas.html)로 넘어가는 함수
    function changeLang(lang) {
        if(lang === 'KR') {
            location.href = 'canvas.html'; // 한글판 파일명
        }
    }

    function setMode(mode) {
        canvas.isDrawingMode = (mode === 'draw');
        if(canvas.isDrawingMode) {
            canvas.freeDrawingBrush = new fabric.PencilBrush(canvas);
            canvas.freeDrawingBrush.width = 5;
            canvas.freeDrawingBrush.color = document.getElementById('cp').value;
        }
    }
    function updateBrush() { if(canvas.isDrawingMode) canvas.freeDrawingBrush.color = document.getElementById('cp').value; }
    
    function saveWithTitle() {
        const title = prompt("Enter Title:");
        if (!title) return;
        const canvasData = JSON.stringify(canvas.toJSON());
        let allSaves = JSON.parse(localStorage.getItem('AiNoteX_Saves_All') || '{}');
        allSaves[title] = canvasData;
        localStorage.setItem('AiNoteX_Saves_All', JSON.stringify(allSaves));
        updateSaveList();
    }

    function updateSaveList() {
        const select = document.getElementById('save-list');
        const allSaves = JSON.parse(localStorage.getItem('AiNoteX_Saves_All') || '{}');
        select.innerHTML = `<option value="">📂 Saved List</option>`;
        for (let title in allSaves) {
            let opt = document.createElement('option');
            opt.value = title; opt.innerHTML = title;
            select.appendChild(opt);
        }
    }

    function loadFromList() {
        const title = document.getElementById('save-list').value;
        if (!title) return;
        const allSaves = JSON.parse(localStorage.getItem('AiNoteX_Saves_All') || '{}');
        canvas.loadFromJSON(allSaves[title], function() { canvas.renderAll(); });
    }

    function deleteFromList() {
        const title = document.getElementById('save-list').value;
        if (!title || !confirm("Delete?")) return;
        let allSaves = JSON.parse(localStorage.getItem('AiNoteX_Saves_All') || '{}');
        delete allSaves[title];
        localStorage.setItem('AiNoteX_Saves_All', JSON.stringify(allSaves));
        updateSaveList();
        canvas.clear(); canvas.backgroundColor='#ffffff';
    }

    function addObj(type) {
        setMode('select');
        const color = document.getElementById('cp').value;
        const size = parseInt(document.getElementById('sp').value) || 80;
        let obj; const opt = { left: 100, top: 100, fill: color, stroke: '#000', strokeWidth: 2 };
        if(type === 'rect') obj = new fabric.Rect({ ...opt, width: size, height: size });
        if(type === 'circle') obj = new fabric.Circle({ ...opt, radius: size/2 });
        if(type === 'ring') obj = new fabric.Circle({ ...opt, radius: size/2, fill: '', stroke: color, strokeWidth: size/5 });
        if(type === 'star') obj = new fabric.Polygon([{x:0,y:-40},{x:10,y:-10},{x:40,y:-10},{x:15,y:10},{x:25,y:40},{x:0,y:20},{x:-25,y:40},{x:-15,y:10},{x:-40,y:-10},{x:-10,y:-10}], { ...opt, scaleX: size/50, scaleY: size/50 });
        if(type === 'heart') obj = new fabric.Path('M 272 238 C 206 238 152 292 152 358 C 152 493 288 528 381 662 C 468 529 609 489 609 358 C 609 292 556 238 489 238 C 441 238 400 267 381 307 C 362 267 320 238 272 238 z', { ...opt, scaleX: size/500, scaleY: size/500 });
        if(type === 'cloud') obj = new fabric.Path('M 25 10 C 15 10 10 20 15 30 C 5 35 10 45 20 45 C 20 55 35 55 40 45 C 50 45 55 35 45 30 C 50 20 40 10 25 10 Z', { ...opt, scaleX: size/30, scaleY: size/30 });
        if(type === 'chat') obj = new fabric.Path('M 10 10 H 90 V 70 H 40 L 20 90 V 70 H 10 Z', { ...opt, scaleX: size/50, scaleY: size/50 });
        if(type === 'arrow') obj = new fabric.Path('M 0 0 L 20 0 L 20 -10 L 40 10 L 20 30 L 20 20 L 0 20 Z', { ...opt, scaleX: size/40, scaleY: size/40 });
        if(type === 'text') obj = new fabric.IText('Input', { left: 100, top: 100, fill: color, fontSize: 30 });
        if(type === 'window') obj = new fabric.Group([new fabric.Rect({width:100,height:20,fill:'#fff',stroke:'#000',strokeWidth:2}),new fabric.Line([0,10,100,10],{stroke:'#000',strokeWidth:1})], {left:100,top:100});
        if(type === 'door') obj = new fabric.Group([new fabric.Rect({width:5,height:60,fill:'#000'}),new fabric.Path('M 0 60 Q 60 60 60 0',{fill:'',stroke:'#000',strokeWidth:2,strokeDashArray:[5,5]})], {left:100,top:100});
        if(obj) { canvas.add(obj); canvas.setActiveObject(obj); canvas.renderAll(); }
    }
    function deleteObj() { const active = canvas.getActiveObject(); if(active) { canvas.remove(active); canvas.renderAll(); } }
    function clearAll() { if(confirm("Clear?")) { canvas.clear(); canvas.backgroundColor = '#ffffff'; } }
</script>


</body>
</html>
