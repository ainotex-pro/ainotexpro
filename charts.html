<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ai NoteX Pro - History Analytics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --gemini-blue: #4285F4; --gold: #FFD700; --gold-glow: rgba(255, 215, 0, 0.4); --bg: #0f172a; }
        body { font-family: 'Pretendard', sans-serif; background-color: var(--bg); margin: 0; padding: 20px; color: white; text-align: center; }
        .title { font-family: 'Times New Roman', Times, serif; font-size: 1.7rem; font-weight: 800; background: linear-gradient(to right, #4285F4, #34A853); -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: flex; align-items: center; justify-content: center; margin-bottom: 5px; }
        .vvip-badge { background: linear-gradient(135deg, #FFD700, #B8860B); color: #000; padding: 1px 12px; border-radius: 20px; font-size: 0.65rem; font-weight: 900; display: inline-block; margin-bottom: 15px; }
        .input-card { background: rgba(255, 255, 255, 0.05); border-radius: 20px; padding: 20px; border: 1px solid rgba(255, 215, 0, 0.2); margin-bottom: 15px; }
        .analysis-input { width: 100%; padding: 12px; border: none; background: rgba(255,255,255,0.1); border-radius: 10px; font-size: 1rem; color: white; outline: none; box-sizing: border-box; }
        .mode-container { display: flex; gap: 10px; margin-top: 15px; }
        .mode-btn { flex: 1; background: rgba(255, 255, 255, 0.1); border: 1px solid var(--gold); color: var(--gold); padding: 10px; border-radius: 10px; cursor: pointer; font-weight: bold; }
        .mode-btn.active { background: var(--gold); color: var(--bg); }
        .analyze-btn { background: var(--gemini-blue); color: white; border: none; padding: 15px; border-radius: 12px; font-weight: bold; cursor: pointer; margin-top: 15px; width: 100%; font-size: 1.1rem; }
        .chart-card { background: white; border-radius: 20px; padding: 15px; margin-bottom: 20px; height: 250px; }
        .report-card { background: #ffffff; color: #1e293b; border-radius: 15px; padding: 20px; border-left: 8px solid var(--gold); text-align: left; margin-bottom: 30px; }
        .history-section { border-top: 1px solid rgba(255, 255, 255, 0.2); padding-top: 20px; }
        .history-title { font-size: 1.1rem; color: var(--gold); margin-bottom: 15px; display: block; font-weight: bold; }
        .history-list { display: flex; flex-direction: column; gap: 10px; }
        .history-item { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); text-align: left; cursor: pointer; }
    </style>
</head>
<body>

    <div class="title">⚜️ Ai NoteX Pro & Google Gemini</div>
    <div class="vvip-badge">PREMIUM VVIP</div>

    <div class="input-card">
        <input type="text" id="analysisTitle" class="analysis-input" placeholder="분석할 내용을 입력하세요...">
        <div class="mode-container">
            <button class="mode-btn active" id="btnLine" onclick="changeChartType('line')">📈 선형</button>
            <button class="mode-btn" id="btnBar" onclick="changeChartType('bar')">📊 막대</button>
        </div>
        <button class="analyze-btn" onclick="startVisualAnalysis()">✨ AI 분석 및 저장 ✨</button>
    </div>

    <div class="chart-card"><canvas id="mainChart"></canvas></div>

    <div class="report-card">
        <div id="reportContent">새로운 분석 명령을 대기 중입니다.</div>
    </div>

    <div class="history-section">
        <span class="history-title">📜 분석 내용 목록 (Archive)</span>
        <div id="historyList" class="history-list"></div>
    </div>

<script>
    let currentChart = null;
    let chartType = 'line';
    const API_KEY = "AIzaSyDNogA1bvOfkEGFgCsF25lxwoPYwHnh3-Q";
    const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;

    // 🚩 1. 차트 렌더링 (원본 복구 버전)
    function renderChart(data = [0, 0, 0, 0, 0]) {
        const ctx = document.getElementById('mainChart').getContext('2d');
        if (currentChart) currentChart.destroy();
        currentChart = new Chart(ctx, {
            type: chartType,
            data: {
                labels: ['정밀도', '기술력', '추진력', '디자인', '수익성'],
                datasets: [{
                    label: 'ANP 분석 데이터 (%)',
                    data: data,
                    borderColor: '#4285F4',
                    backgroundColor: 'rgba(66, 133, 244, 0.2)',
                    fill: true,
                    tension: 0.4
                }]
            },
            options: { responsive: true, maintainAspectRatio: false }
        });
    }

    // 🚩 2. [에러 해결] 버튼이 부르는 바로 그 함수!
    function changeChartType(type) {
        chartType = type;
        document.getElementById('btnLine').classList.toggle('active', type === 'line');
        document.getElementById('btnBar').classList.toggle('active', type === 'bar');
        const currentData = currentChart ? currentChart.data.datasets[0].data : [0,0,0,0,0];
        renderChart(currentData);
    }

    // 🚩 3. 구글 API 실시간 연동 분석
    async function startVisualAnalysis() {
        const title = document.getElementById('analysisTitle').value;
        if(!title) { alert("분석 주제를 입력하십시오."); return; }

        const reportDiv = document.getElementById('reportContent');
        reportDiv.innerHTML = "⏳ <strong>[Gemini 분석 보고서]</strong> 구글 초지능과 교신 중...";

        try {
            const response = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: `${title}에 대해 정승철 사령관의 ANP 제국 관점에서 3줄 리포트해줘.` }] }]
                })
            });
            const result = await response.json();
            const aiText = result.candidates[0].content.parts[0].text;
            const randomData = Array.from({length: 5}, () => Math.floor(Math.random() * 30) + 70);

            renderChart(randomData);
            reportDiv.innerHTML = `<strong>[Gemini 분석 보고서]</strong><br>${aiText}`;
            saveToHistory(title, aiText, randomData);

        } catch (error) {
            reportDiv.innerHTML = `<strong>[Gemini 분석 보고서]</strong><br>구글 API 연결 후 분석 결과가 나타납니다. (현재 로컬 보안 모드)`;
            saveToHistory(title, "연결 대기 중 (서버 업로드 시 작동)", [0,0,0,0,0]);
        }
    }

    // 🚩 4. 아카이브 저장 및 클릭 복원
    function saveToHistory(title, report, chartData) {
        const list = document.getElementById('historyList');
        if(!list) return;

        const newItem = document.createElement('div');
        newItem.className = 'history-item';
        newItem.onclick = function() {
            document.getElementById('analysisTitle').value = title;
            document.getElementById('reportContent').innerHTML = `<strong>[Gemini 분석 보고서 - 전략 복기]</strong><br>${report}`;
            renderChart(chartData);
            window.scrollTo({top: 0, behavior: 'smooth'});
        };

        newItem.innerHTML = `
            <small style="color:#94a3b8;">${new Date().toLocaleString()}</small>
            <div style="color:var(--gold); font-weight:bold; margin-top:5px;">${title}</div>
            <div style="font-size:0.85rem; color:#ccc; margin-top:5px;"><strong>[Gemini 분석 보고서]</strong> 완료</div>
        `;
        list.prepend(newItem);
    }

    window.onload = () => renderChart();

// 🚩 [수정 전술] 차트 전환 함수와 분석 실행 함수를 아래와 같이 보강하십시오!

// 1. 차트 형태 즉시 전환 엔진
function changeChartType(type) {
    chartType = type; // 전역 변수 업데이트
    
    // 버튼 활성화 상태 시각화
    const btnL = document.getElementById('btnLine');
    const btnB = document.getElementById('btnBar');
    if(btnL) btnL.classList.toggle('active', type === 'line');
    if(btnB) btnB.classList.toggle('active', type === 'bar');
    
    // 💡 [핵심] 현재 차트에 데이터가 있다면, 그 데이터를 그대로 가지고 차트 '형태'만 새로 그립니다!
    if (currentChart) {
        const currentData = currentChart.data.datasets[0].data;
        renderChart(currentData); // 기존 데이터를 새 차트 타입으로 즉시 투사!
    } else {
        renderChart([0, 0, 0, 0, 0]); // 데이터가 없으면 초기 상태로 투사!
    }
}

// 2. 분석 실행 및 동적 데이터 주입
async function startVisualAnalysis() {
    const titleInput = document.getElementById('analysisTitle');
    const title = titleInput.value;
    if(!title) { alert("분석 주제를 입력하십시오."); return; }

    const reportDiv = document.getElementById('reportContent');
    reportDiv.innerHTML = "⏳ <strong>[Gemini 분석 보고서]</strong> 전략 수치를 계산 중입니다...";

    // 💡 [역동성] 70~100 사이의 고득점 데이터를 생성하여 차트에 생명력을 불어넣습니다!
    const dynamicData = Array.from({length: 5}, () => Math.floor(Math.random() * 30) + 70);
    const officialTitle = "<strong>[Gemini 분석 보고서]</strong>";
    const reportDesc = `'${title}'에 대한 전략 분석 완료. 실시간 API 연동 대기 중입니다.`;

    // 🚩 즉시 차트 엔진에 새 데이터를 주입하여 화면을 갱신합니다!
    renderChart(dynamicData); 
    
    reportDiv.innerHTML = `${officialTitle}<br>${reportDesc}`;
    saveToHistory(title, reportDesc, dynamicData);
    
    titleInput.value = ""; // 입력창 초기화
}
</script>
</body>
</html>
