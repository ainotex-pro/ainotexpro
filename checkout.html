<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>결제 페이지</title>
    <style>
        body { font-family: sans-serif; padding: 30px; background-color: #f4f7f9; display: flex; justify-content: center; }
        .pay-container { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        .price-tag { font-size: 24px; font-weight: bold; color: #333; margin: 20px 0; padding: 15px; background: #f8faff; border-radius: 10px; }
        .pay-btn { width: 100%; padding: 15px; border: none; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; color: white; margin-bottom: 10px; }
        .btn-toss { background-color: #3182f6; }
        .btn-kakao { background-color: #ffeb00; color: #3c1e1e; }
        .btn-back { background: none; border: 1px solid #ccc; color: #666; font-size: 14px; margin-top: 20px; }
    </style>
</head>
<body>

<div class="pay-container">
    <h2>주문 결제</h2>
    <p style="color: #666;">선택하신 항목을 결제합니다.</p>
    
    <div class="price-tag">
        결제 금액: <span id="display-price">50,000원</span>
    </div>

    <button onclick="pay('toss')" class="pay-btn btn-toss">토스페이로 결제</button>
    <button onclick="pay('kakao')" class="pay-btn btn-kakao">카카오페이로 결제</button>
    
    <button onclick="history.back()" class="pay-btn btn-back">뒤로 가기</button>
</div>

<script>
    function pay(method) {
        alert(method + ' 결제창을 불러오는 중입니다...');
        // 여기에 나중에 제공업체 코드를 넣으시면 됩니다.
    }

    // 메인화면(index.html)에서 저장한 금액이 있다면 불러오기
    window.onload = function() {
        const savedPrice = localStorage.getItem('payAmount');
        if (savedPrice) {
            document.getElementById('display-price').innerText = savedPrice + '원';
        }
    }
</script>

</body>
</html>
