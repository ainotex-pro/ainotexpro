<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Google Gemini Search - AiNoteX Pro</title>
    <meta name="theme-color" content="#000000">
    
    <link rel="icon" href="./favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Libre+Baskerville:wght@700&family=Roboto:wght@700&display=swap" rel="stylesheet">

    <style>
        :root {
            --google-blue: #4285F4;
            --google-green: #34A853;
            --google-yellow: #FBBC05;
            --google-red: #EA4335;
            --gold-border: #D4AF37;
        }

        /* 1. 배경 설정: 이미지를 최우선으로 적용 */
        body { 
            margin: 0; padding: 0;
            background: url('images/main-bg-1.webp') no-repeat center center fixed; 
            background-size: cover;
            font-family: 'Noto Sans KR', sans-serif;
            min-height: 100vh;
        }

        /* 2. 언어 선택 버튼 */
        .lang-control {
            position: absolute; top: 15px; right: 15px;
            background: rgba(255, 255, 255, 0.8);
            padding: 5px 12px; border-radius: 20px;
            font-size: 12px; font-weight: bold;
        }
        .lang-btn { background: none; border: none; cursor: pointer; color: #555; font-weight: 900; }
        .lang-divider { margin: 0 5px; color: #ccc; }

        /* 3. 헤더 박스 스타일 */
        .header-bar { 
            display: flex; align-items: center; justify-content: center; 
            background: rgba(255, 255, 255, 0.9); 
            border: 2px solid #FFFACD; padding: 10px 20px;
            margin: 55px auto 20px auto; width: 85%; max-width: 600px;
            border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .header-text { 
            font-size: 20px; font-weight: 900; 
            background: linear-gradient(45deg, var(--google-blue), var(--google-green));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        /* 4. 구글 상단 바로가기 (2열 그리드) */
        .top-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
            width: 90%; max-width: 500px; margin: 0 auto 15px auto;
        }
        .top-link {
            display: flex; align-items: center; height: 48px; padding: 0 12px;
            background-color: var(--google-blue); border-radius: 12px;
            color: #fff; font-size: 13px; font-weight: 600; text-decoration: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: 0.3s;
        }
        .icon-circle {
            width: 28px; height: 28px; background: #fff; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; margin-right: 8px;
        }

        /* 5. 메인 리스트 버튼 (골드 스타일) */
        .main-list-btn {
            display: flex; align-items: center; width: 90%; max-width: 500px; height: 42px;
            margin: 10px auto; padding: 0 20px;
            background: linear-gradient(90deg, #fff9c4 0%, #dcedc8 30%, #b3e5fc 70%, #f1f8e9 100%);
            border: 2px solid var(--gold-border); border-radius: 24px;
            color: #2c3e50; font-size: 14px; font-weight: 700; text-decoration: none;
            transition: all 0.3s ease; box-shadow: 0 4px 10px rgba(255,215,0,0.2);
            box-sizing: border-box;
        }
        .main-list-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(255, 223, 0, 0.4);
        }
        .main-list-btn img, .main-list-btn svg { margin-right: 12px; flex-shrink: 0; }
        .btn-arrow { margin-left: auto; color: #888; }

        /* 하단 관리자 버튼 */
        .admin-link { position: fixed; bottom: 10px; right: 10px; color: #ccc; font-size: 11px; cursor: pointer; text-decoration: none; }


    </style>

<script>
// [main.html 전용 언어 전환 스위치]
function changeLang(lang) {
    if (lang === 'KR') {
        // 이미 한글판이니 새로고침만 하거나 main.html로 이동
        location.href = 'main.html'; 
    } else {
        // 영어 버튼을 누르면 영문판(mainen.html)으로 정밀 도약!
        location.href = 'mainen.html';
    }
}

</script>

</head>
<body>

<div class="lang-control">
    <button class="lang-btn" onclick="changeLang('KR')">KR</button>
    <span class="lang-divider">/</span>

</div>

<div class="header-bar">

</div>
