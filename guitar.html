<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ai NoteX Pro - Sound Fixed</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&family=Noto+Sans+KR:wght@700&display=swap" rel="stylesheet">
    <style>
        body { 
            margin: 0; padding: 0; overflow: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start; 
            height: 100vh; width: 100vw;
            background: #000 url('images/piano.webp') no-repeat center center fixed !important; 
            background-size: cover !important;
            font-family: 'Noto Sans KR', sans-serif;
            user-select: none; -webkit-user-select: none; touch-action: none;
        }
        .header-container { margin-top: 15px; margin-bottom: 10px; width: 100%; display: flex; flex-direction: column; align-items: center; z-index: 10; }
        .header-bar { 
            display: flex; align-items: center; justify-content: center; 
            background: rgba(255, 255, 255, 0.95); border: 1px solid #FFFACD; 
            padding: 10px 19px; margin: 3px auto; border-radius: 10px;
            box-shadow: 0 3px 11px rgba(0,0,0,0.3); min-width: 300px;
        }
        .header-text { 
            font-size: 27px; font-weight: 800;
            background: linear-gradient(45deg, #4285F4, #34A853); 
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            font-family: 'Playfair Display', serif;
        }
        .guitar-board {
            display: flex; flex-direction: row; justify-content: center; align-items: center;
            background: rgba(15, 15, 15, 0.95); border: 3px solid #4deeea;
            border-radius: 20px; padding: 15px;
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.5);
            backdrop-filter: blur(10px); width: 87%; max-width: 400px;
        }
        .chord-section { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-right: 12px; }
        .chord-btn {
            width: 50px; height: 42px; background: #222; border: 2px solid #4deeea;
            color: #fff; font-size: 0.85rem; font-weight: bold; cursor: pointer; border-radius: 8px;
        }
        .chord-btn.active { background: #4deeea; color: #000; box-shadow: 0 0 15px #4deeea; }
        .string-section { flex-grow: 1; height: 360px; display: flex; flex-direction: column; justify-content: space-between; }
        .string {
            width: 95%; height: 44px; 
            background: linear-gradient(to bottom, #777, #fff 50%, #444);
            border-radius: 6px; cursor: pointer; transition: 0.1s;
            box-shadow: 0 3px 6px rgba(0,0,0,0.7);
        }
        .string:active { background: linear-gradient(to bottom, #4deeea, #fff, #4deeea); box-shadow: 0 0 25px #4deeea; }
    </style>
</head>
<body oncontextmenu="return false;" onclick="unlockAudio()" ontouchstart="unlockAudio()">

    <div class="header-container">
        <div class="header-bar"><span class="header-text">Ai NoteX Pro</span></div>
        <div class="header-bar"><span class="header-text" style="font-size: 14px; color: #0066cc !important; -webkit-text-fill-color: #0066cc;">⚡"GUITAR SOUNDS"⚡</span></div>
    </div>



    <div class="guitar-board">
        <div class="chord-section">
            <button class="chord-btn active" onclick="setChord('C', this)">C</button>
            <button class="chord-btn" onclick="setChord('G', this)">G</button>
            <button class="chord-btn" onclick="setChord('Am', this)">Am</button>
            <button class="chord-btn" onclick="setChord('Em', this)">Em</button>
            <button class="chord-btn" onclick="setChord('D', this)">D</button>
            <button class="chord-btn" onclick="setChord('F', this)">F</button>
            <button class="chord-btn" onclick="setChord('A', this)">A</button>
            <button class="chord-btn" onclick="setChord('E', this)">E</button>
            <button class="chord-btn" onclick="setChord('Dm', this)">Dm</button>
            <button class="chord-btn" onclick="setChord('Bm', this)">Bm</button>
        </div>

        <div class="string-section">
            <div class="string" onclick="playGuitar(0)"></div>
            <div class="string" onclick="playGuitar(1)"></div>
            <div class="string" onclick="playGuitar(2)"></div>
            <div class="string" onclick="playGuitar(3)"></div>
            <div class="string" onclick="playGuitar(4)"></div>
            <div class="string" onclick="playGuitar(5)"></div>
        </div>
    </div>

    <script>
        let audioCtx = null;
        const chordData = {
            'C':  { freqs: [130.81, 164.81, 196.00, 261.63, 329.63, 392.00], type: 'triangle' },
            'G':  { freqs: [98.00, 123.47, 146.83, 196.00, 246.94, 293.66], type: 'sawtooth' },
            'Am': { freqs: [110.00, 130.81, 164.81, 220.00, 261.63, 329.63], type: 'sine' },
            'Em': { freqs: [82.41, 123.47, 164.81, 246.94, 329.63, 493.88], type: 'sine' },
            'D':  { freqs: [146.83, 220.00, 293.66, 369.99, 440.00, 587.33], type: 'triangle' },
            'F':  { freqs: [87.31, 130.81, 174.61, 220.00, 261.63, 349.23], type: 'square' },
            'A':  { freqs: [110.00, 138.59, 164.81, 220.00, 277.18, 329.63], type: 'triangle' },
            'E':  { freqs: [82.41, 103.83, 123.47, 164.81, 207.65, 246.94], type: 'sawtooth' },
            'Dm': { freqs: [146.83, 174.61, 220.00, 293.66, 349.23, 440.00], type: 'sine' },
            'Bm': { freqs: [123.47, 146.83, 185.00, 246.94, 293.66, 369.99], type: 'sine' }
        };
        let currentChord = chordData['C'];

        function unlockAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function setChord(chord, btn) {
            unlockAudio();
            document.querySelectorAll('.chord-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentChord = chordData[chord];
        }

        function playGuitar(idx) {
            unlockAudio();
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = currentChord.type; 
            osc.frequency.setValueAtTime(currentChord.freqs[idx], audioCtx.currentTime);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1);
            osc.connect(gain); 
            gain.connect(audioCtx.destination);
            osc.start(); 
            osc.stop(audioCtx.currentTime + 1);
        }


    </script>
</body>

    <div style="margin: 10px 0; z-index: 100;">
        <button onclick="location.href='piano.html'" style="padding: 8px 15px; background: #222; border: 2px solid #4deeea; color: #4deeea; border-radius: 20px; font-weight: bold; cursor: pointer;">
            🎹 PIANO MODE
        </button>
    </div>
</html>
