<head>

    <style>
        /* 기본 잡기 */
        body {
            margin: 0; padding: 0; min-height: 100vh;
            font-family: 'Noto Sans KR', sans-serif;
            background: url('images/hello-bg-1.webp') no-repeat center center fixed;
            background-size: cover;
            display: flex; flex-direction: column; align-items: center;
            justify-content: flex-start;
            color: #202124;
        }

        /* 1. 상단 타이틀 섹션 */
        .header-section {
            margin-top: 60px;
            text-align: center;
        }

        .hello-text {
            font-size: 24px; font-weight: 900; color: #4285F4; margin-bottom: 5px;
        }

        .main-title {
            font-family: 'Libre Baskerville', serif;
            font-size: 48px; font-weight: 900;
            background: linear-gradient(45deg, #4285F4, #34A853, #FBBC05, #EA4335);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0; letter-spacing: -1.5px;
        }

        /* 2.  폰트 구역' */
        .motto-container {
            margin-top: 50px;
            text-align: center;
        }

        .motto-text {
            font-size: 19px; line-height: 1.8; color: #202124; font-weight: 500;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.9); /* 배경 위 가독성 */
            margin-bottom: 25px;
        }

        .strong-text {
            font-size: 22px; line-height: 1.6; color: #202124; font-weight: 900;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.9);
        }

        /* 3. 버튼 */
        .main-btn {
            margin-top: 40px;
            background-color: #34A853;
            color: white;
            padding: 18px 40px;
            font-size: 18px;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 900;
            box-shadow: 0 4px 15px rgba(52, 168, 83, 0.3);
            transition: 0.3s;
        }
        .main-btn:hover { transform: scale(1.05); }
    </style>
</head>
<body>

    <div class="header-section">
        <div class="hello-text">Hello !</div>
        <h1 class="main-title">Ai NoteX Pro</h1>
        <p style="font-size: 14px; font-weight: 700; color: #5f6368; letter-spacing: 2px; margin-top: 10px;">
            PROGRESSIVE WEB APPS | SINCE 2026
        </p>
    </div>

    <div class="motto-container">
        <img src="google-80.png" width="50" height="50" style="margin-bottom: 20px;">
        


        </div>
    </div>
 </div>
<style>
    /* 그라데이션 버튼 스타일 */
    .main-btn {
        margin-top: 50px;
        /* 높이는 줄이고 좌우로 넓혀서 날렵하게! */
        padding: 12px 45px; 
        font-size: 18px;
        font-weight: 900;
        color: white;
        border: none;
        border-radius: 50px;
        cursor: pointer;
        
        /* 은은하고 고급스러운 그라데이션 */
        background: linear-gradient(45deg, #4285F4, #34A853); 
        
        box-shadow: 0 4px 15px rgba(66, 133, 244, 0.3);
        transition: all 0.3s ease;
        display: inline-block;
        text-decoration: none;
    }

    /* 마우스를 올리면 더 영롱하게 빛나도록! */
    .main-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(66, 133, 244, 0.4);
        background: linear-gradient(45deg, #3b71ca, #2d8e47);
    }
</style>
