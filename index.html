            box-shadow: 0 4px 15px rgba(66, 133, 244, 0.3);
            transition: all 0.3s ease; text-decoration: none; display: inline-block;
        }
        .footer-text { margin-top: 40px; color: #f5f2f2; font-size: 13px; font-weight: 700; text-align: center; text-shadow: 1px 1px 3px rgba(0,0,0,0.5); }
