<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AiNoteX Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;800&family=Playfair+Display:wght@900&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0; padding: 0; min-height: 100vh;
            background: url('images/main-bg-1.webp') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Noto Sans KR', sans-serif;
            text-align: center;
        }

        /* 상단 언어 버튼 */
        .lang-control { padding: 5px 15px 0 0; text-align: right; }
        .lang-btn { background: none; border: none; color: #333; font-weight: 800; cursor: pointer; }

        /* 메인 로고 박스 */
        .header-bar {
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid #FFFACD;
            padding: 8px 15px;
            margin: 5px auto 10px auto;
            width: 85%; max-width: 900px;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
        }
        .header-text { 
            font-family: 'Playfair Display', serif;
            font-size: 30px; font-weight: 900;
            background: linear-gradient(45deg, #4285F4, #34A853); 
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* 베스트셀러 타이틀 박스 */
        .world-title-box {
            margin: 5px auto 12px auto;
            width: 82%; max-width: 450px;
            background: linear-gradient(135deg, #20B2AA, #4682B4); 
            color: #ffffff; padding: 12px 5px; 
            border-radius: 17px; border: 5px double #FFD700; 
            font-weight: 800; font-size: 15px; 
        }

        /* ★ 사령관님이 명하신 '낮은 높이'의 버튼 컨테이너 ★ */
        .category-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* 한 줄에 3개 */
            gap: 8px; padding: 10px;
            max-width: 420px; margin: 0 auto;
        }

        .eb-button {
            height: 38px; /* 높이를 낮게 고정! */
            background: linear-gradient(145deg, #ffffff, #f0f0f0);
            border: 1.5px solid #d4af37;
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-weight: 800; color: #333; font-size: 13px;
            text-decoration: none; transition: all 0.2s;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
        }

        .eb-button:hover { background: #d4af37; color: white; }
        .eb-icon { font-size: 16px; margin-right: 5px; }

        .footer-text { font-size: 0.9rem; color: #2F4F4F; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="lang-control">
        <button class="lang-btn" onclick="location.href='indexkr.html'">KR</button> /
        <button class="lang-btn" onclick="location.href='indexen.html'">EN</button>
    </div>

    <div class="header-bar">
        <img src="images/icon-40.png" style="width: 25px; height: 25px; margin-right: 10px;">
        <span class="header-text">Ai NoteX Pro</span>
    </div>

    <div class="world-title-box">
        프로젝트 구텐베르크 - 카테고리별 명작
    </div>

    <div class="category-container">
        <a href="#" class="eb-button"><span class="eb-icon">📜</span>문학</a>
        <a href="#" class="eb-button"><span class="eb-icon">⏳</span>역사</a>
        <a href="#" class="eb-button"><span class="eb-icon">🔬</span>과학</a>
        <a href="#" class="eb-button"><span class="eb-icon">⚙️</span>기술</a>
        <a href="#" class="eb-button"><span class="eb-icon">🩺</span>의학</a>
        <a href="#" class="eb-button"><span class="eb-icon">🍎</span>건강</a>
        <a href="#" class="eb-button"><span class="eb-icon">🎨</span>예술</a>
        <a href="#" class="eb-button"><span class="eb-icon">🌍</span>문화</a>
        <a href="#" class="eb-button"><span class="eb-icon">⚖️</span>철학</a>
        <a href="#" class="eb-button"><span class="eb-icon">🙏</span>종교</a>
        <a href="#" class="eb-button"><span class="eb-icon">✈️</span>여행</a>
        <a href="#" class="eb-button"><span class="eb-icon">🏛️</span>사회</a>
        <a href="#" class="eb-button"><span class="eb-icon">🎓</span>교육</a>
        <a href="#" class="eb-button"><span class="eb-icon">⛳</span>취미</a>
    </div>

    <div style="margin-top: 25px; padding: 15px; border-top: 1px solid rgba(212, 175, 55, 0.3); width: 85%; margin-left: auto; margin-right: auto;">
    <p style="font-size: 13px; color: #555; margin-bottom: 5px; font-weight: 700;">
        "본 자료는 프로젝트 구텐베르크의 소중한 지적 자산입니다."
    </p>
    <div style="margin-top: 25px; padding: 15px; border-top: 1px solid rgba(212, 175, 55, 0.3); width: 85%; margin-left: auto; margin-right: auto;">
    <p style="font-size: 13px; color: #555; margin-bottom: 5px; font-weight: 700;">
        ""더 나은 서비스를 위하여 업데이트 중입니다""
    </p>

  
</div>

<div class="footer-text" style="margin-top: 10px;">
    [ Ai NoteX Pro Beta v2.0 ]
</div>

</body>
</html>
