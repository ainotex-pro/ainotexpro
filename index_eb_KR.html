override fun onCreate(savedInstanceState: Bundle?) {
    super.onCreate(savedInstanceState)
    setContentView(R.layout.activity_main)

    val myWebView: WebView = findViewById(R.id.webview)
    
    // --- 여기서부터가 '좌우 정렬' 핵심 명령입니다! ---
    myWebView.settings.apply {
        javaScriptEnabled = true // 자바스크립트 허용
        
        // 1. 글자가 화면 밖으로 나가지 않게 자동으로 줄을 바꿔라!
        layoutAlgorithm = WebSettings.LayoutAlgorithm.TEXT_AUTOSIZING
        
        // 2. 페이지를 화면 너비에 강제로 맞춰라!
        useWideViewPort = true
        loadWithOverviewMode = true
        
        // 3. 손가락으로 확대해도 글자가 예쁘게 정렬되게 하라!
        setSupportZoom(true)
        builtInZoomControls = true
        displayZoomControls = false // 돋보기 아이콘은 숨기기 (깔끔하게!)
    }
    
    // 스마트폰인 척 속여서 '모바일 버전'을 강제로 불러오게 하는 암구호입니다!
    myWebView.settings.userAgentString = "Mozilla/5.0 (Linux; Android 10; Mobile) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Mobile Safari/537.36"

    myWebView.webViewClient = WebViewClient()
    myWebView.loadUrl("https://www.gutenberg.org") // 구텐베르크 주소
}
